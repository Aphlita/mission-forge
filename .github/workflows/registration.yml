name: Registration
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  json:
    name: JSON format and fields
    if: github.repository == 'processmission/mission-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate participant JSON files
        run: node scripts/membership.mjs registration-json
        env:
          GITHUB_TOKEN: ${{ github.token }}
  validate:
    needs: json
    if: github.repository == 'processmission/mission-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify GitHub ID, username and PR author
        run: node scripts/membership.mjs registration
        env:
          GITHUB_TOKEN: ${{ github.token }}
