name: Registration
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  validate:
    if: github.repository == 'processmission/mission-forge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate registration identity
        run: node scripts/membership.mjs registration
        env:
          GITHUB_TOKEN: ${{ github.token }}
