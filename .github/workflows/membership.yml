name: Membership
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created, edited]
permissions:
  contents: read
  issues: write
jobs:
  moderate:
    if: github.repository == 'processmission/mission-forge' && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce participant registration
        run: node scripts/membership.mjs moderate
        env:
          GITHUB_TOKEN: ${{ github.token }}
